suite:
  id: thread-titles
  name: Thread Title Generation
  purpose: >
    Verify that POST /api/v1/threads/:id/generate-title produces a short,
    non-empty, topically accurate title from a conversation's content. This
    is the only genuinely LLM-quality-facing piece of the Persistent
    Conversation Memory feature (see
    docs/Design/2026-07-18-persistent-conversation-memory-design.md) —
    everything else in that feature is deterministic persistence/CRUD and
    does not belong in an eval suite. The `input` field on every scenario
    below is the exact prompt api/src/routes/v1/threads.handlers.ts's
    generateTitleHandler sends to the model — keep them in sync if the
    prompt template changes.
  passingThreshold: 0.75
  # generateTitleHandler calls model.invoke(prompt) directly in production —
  # no system message at all. The `input` field above already is that exact
  # prompt, so attaching the chat agent's harness system prompt on top would
  # test a combination that never happens in production.
  appliesHarnessSystemPrompt: false

scenarios:
  - id: tt-001-non-empty
    name: Title is non-empty
    purpose: >
      A blank or whitespace-only title would render as an empty sidebar row
      — the most basic acceptance bar before anything else matters.
    type: deterministic
    input: >
      Summarize the following conversation as a short, specific title (no
      more than 6 words). Do not use quotation marks or end with
      punctuation. Respond with only the title, nothing else.


      Conversation:
      User: How do I set up a multi-stage Docker build for a Node.js app?
      Assistant: Use a build stage with the full node image to compile, then
      copy only the built artifacts into a slim runtime image based on
      node:alpine. This keeps your final image small since dev dependencies
      and build tools never ship.
    match: regex
    expected: '\S'

  - id: tt-002-reasonable-length
    name: Title stays within a reasonable length
    purpose: >
      generate-title is meant to produce a short sidebar label, not a
      restated summary of the conversation. A title that runs on for
      paragraphs indicates the model ignored the length instruction.
    type: deterministic
    input: >
      Summarize the following conversation as a short, specific title (no
      more than 6 words). Do not use quotation marks or end with
      punctuation. Respond with only the title, nothing else.


      Conversation:
      User: How do I set up a multi-stage Docker build for a Node.js app?
      Assistant: Use a build stage with the full node image to compile, then
      copy only the built artifacts into a slim runtime image based on
      node:alpine. This keeps your final image small since dev dependencies
      and build tools never ship.
    match: regex
    expected: '^[\s\S]{1,80}$'

  - id: tt-003-topical-accuracy
    name: Title reflects the conversation's actual topic
    purpose: >
      A generic title ("Chat conversation", "Help request") defeats the
      purpose of the feature — the sidebar needs to let you distinguish
      threads at a glance.
    # Converted from `type: semantic` (ws-002's pattern): wiki-search.yaml's
    # ws-002 proved embedding-similarity scoring unusable against this
    # repo's configured embedding backend (real answers scored 0.03-0.11,
    # an unrelated answer scored 0.54 — see ws-002's own comment for the
    # full measured experiment). tt-003 was the only other surviving
    # `type: semantic` scenario and shares the same backend, so this
    # conversion applies that finding by inference rather than a fresh
    # measured run against tt-003 specifically. Re-run ws-002's diagnostic
    # method against this scenario's own input/expected pair for hard
    # numbers before treating this as independently confirmed.
    type: llm-judge
    input: >
      Summarize the following conversation as a short, specific title (no
      more than 6 words). Do not use quotation marks or end with
      punctuation. Respond with only the title, nothing else.


      Conversation:
      User: How do I set up a multi-stage Docker build for a Node.js app?
      Assistant: Use a build stage with the full node image to compile, then
      copy only the built artifacts into a slim runtime image based on
      node:alpine. This keeps your final image small since dev dependencies
      and build tools never ship.
    rubric: >
      Hard requirement: the title must specifically reference Docker,
      multi-stage builds, or Node.js — not a vague generic phrase ("Chat
      conversation", "Docker question"). Score no higher than 3/10 if the
      title is generic or fails to mention any of those elements.

      Given that's met, it must also not invent details absent from the
      conversation (no specific cloud provider, CI tool, or version number
      was mentioned). A title that's specific and doesn't fabricate has
      done its job: score it 8 or higher.
    minScore: 7

  - id: tt-004-not-generic-or-fabricated
    name: Title is specific, not generic or fabricated
    purpose: >
      LLM-judged check for the failure modes a similarity score alone can
      miss — a title that's technically on-topic but vague ("Docker
      question"), or one that invents details not present in the
      conversation (e.g. naming a specific cloud provider that was never
      mentioned).
    type: llm-judge
    input: >
      Summarize the following conversation as a short, specific title (no
      more than 6 words). Do not use quotation marks or end with
      punctuation. Respond with only the title, nothing else.


      Conversation:
      User: How do I set up a multi-stage Docker build for a Node.js app?
      Assistant: Use a build stage with the full node image to compile, then
      copy only the built artifacts into a slim runtime image based on
      node:alpine. This keeps your final image small since dev dependencies
      and build tools never ship.
    rubric: >
      Hard requirement: the title must specifically mention Docker,
      multi-stage builds, or Node.js — not a vague generic phrase like
      "Chat conversation" or "Docker question" — and must not invent
      details absent from the conversation (no specific cloud provider, CI
      tool, or version number was mentioned; inventing one is a
      fabrication). Score no higher than 3/10 if the title is generic or
      fabricates a detail.

      Given that's met, it should also read as a short title, not a
      sentence. A title that's specific, grounded, and title-length has
      done its job: score it 8 or higher.
    minScore: 7

  # The four scenarios above all summarize the same fixed Docker/Node.js
  # conversation — a 100% pass rate there only proves the model can title
  # one technical conversation well, four times over. The scenarios below
  # exercise the same "specific, not generic, not fabricated" failure mode
  # against inputs the Docker conversation can't stress: a non-technical
  # topic, a conversation that pivots between two subjects mid-thread, and a
  # near-content-free exchange. See the "Agent Behavior Baseline" eval run
  # from 2026-07-22 for the original motivation.

  - id: tt-005-non-technical-topic
    name: Title is specific for a non-technical conversation
    purpose: >
      Every existing scenario is a Docker/Node.js conversation — this
      guards against the model (or a future prompt change) implicitly
      relying on technical vocabulary to sound specific. A travel-planning
      exchange has no jargon to lean on, so a lazy or generic title has
      nowhere to hide.
    type: llm-judge
    input: >
      Summarize the following conversation as a short, specific title (no
      more than 6 words). Do not use quotation marks or end with
      punctuation. Respond with only the title, nothing else.


      Conversation:
      User: We're thinking about a weekend trip to the coast, any
      recommendations for a low-key beach town within a few hours of
      Portland?
      Assistant: Cannon Beach is a solid pick — walkable town, Haystack
      Rock right on the beach, and it's about a 90 minute drive. Less
      crowded than Seaside if you want something quieter.
    rubric: >
      Hard requirement: the title must specifically reference Cannon
      Beach, the coast, or a beach-town weekend trip — not a vague generic
      phrase like "Travel Chat" or "Weekend Plans" — and must not invent
      details absent from the conversation (no specific hotel, date, or
      price was mentioned). Score no higher than 3/10 if the title is
      generic or fabricates a detail.

      Given that's met, it should also read as a short title, not a
      sentence. A title that's specific, grounded, and title-length has
      done its job: score it 8 or higher.
    minScore: 7

  - id: tt-006-topic-pivot
    name: Title reflects a conversation that pivots between two topics
    purpose: >
      Real conversations aren't always about one thing — this checks the
      model doesn't fixate on only the first topic (or the last) when the
      user pivots mid-thread, and doesn't fall back to something generic
      because no single topic dominates.
    type: llm-judge
    input: >
      Summarize the following conversation as a short, specific title (no
      more than 6 words). Do not use quotation marks or end with
      punctuation. Respond with only the title, nothing else.


      Conversation:
      User: What's a good substitute for buttermilk in a pancake recipe?
      Assistant: Mix a tablespoon of lemon juice or white vinegar into a
      cup of regular milk and let it sit for five minutes — it'll curdle
      slightly and work just like buttermilk.
      User: Nice, and what wine would pair with a brunch like that?
      Assistant: A dry sparkling wine like Cava or Prosecco works well with
      pancakes and brunch food generally — the acidity cuts through the
      richness of syrup and butter.
    rubric: >
      Hard requirement: the conversation covers two related topics — a
      buttermilk substitute for pancakes, then a wine pairing for that
      same brunch. The title must reflect the conversation reasonably
      (referencing brunch, pancakes, and/or wine pairing) rather than
      fixating only on the buttermilk substitute and ignoring the pivot,
      or falling back to something generic like "Cooking Chat". Score no
      higher than 3/10 if the title is generic or ignores the pivot
      entirely.

      Given that's met, do not penalize a title that leads with either
      topic, as long as it doesn't read as unrelated to what was
      discussed, and it must not invent details absent from the
      conversation (no specific brand or dish name was mentioned). A title
      that reflects the pivot and doesn't fabricate has done its job:
      score it 8 or higher.
    minScore: 7

  - id: tt-007-minimal-content
    name: Title stays grounded for a near-content-free exchange
    purpose: >
      A one-line, low-content exchange gives the model the least material
      to work with — and the most temptation to pad the title with
      invented context (e.g. framing a bare arithmetic question as a "tip
      calculation" or "restaurant bill" when neither was mentioned) rather
      than admit there isn't much to summarize.
    type: llm-judge
    input: >
      Summarize the following conversation as a short, specific title (no
      more than 6 words). Do not use quotation marks or end with
      punctuation. Respond with only the title, nothing else.


      Conversation:
      User: What's 15% of 80?
      Assistant: 12.
    rubric: >
      Hard requirement: the title must reference the actual calculation (a
      percentage of a number) and must not invent a scenario or context
      that wasn't stated (no "restaurant bill," "tip calculation," or
      specific currency — none of that was mentioned). Score no higher
      than 3/10 if the title is so vague it could apply to any
      conversation, or if it invents an unstated scenario.

      Given that's met, it should also read as a short title, not a
      sentence. A title that stays grounded in the two lines actually
      exchanged and doesn't embellish has done its job: score it 8 or
      higher.
    minScore: 7
