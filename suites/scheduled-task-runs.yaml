suite:
  id: scheduled-task-runs
  name: Repeated Task Runs — Previous-Run History
  purpose: >
    Every task run now starts in a fresh thread with a clean plan, so the
    only continuity between runs of the same task is the kickoff message: the
    previous run's one-line summary plus the exact read_task_run call that
    opens its full transcript. Verifies the agent uses that call when the
    summary alone can't answer what the task needs, and does not waste a
    turn re-reading history the summary already covers. See
    docs/superpowers/specs/2026-09-26-cron-task-triggers-design.md §3.
  passingThreshold: 1.0
  simulatedTask:
    title: Weekly dependency audit
    description: >
      Run a dependency audit on the project and report which high-severity
      advisories are NEW since the previous run. Advisories that were
      already present last run should be listed separately as "still open".
    outcome: >
      A report listing new high-severity advisories separately from ones
      that were already open in the previous run.

scenarios:
  - id: str-001-reads-previous-run-when-summary-lacks-detail
    name: Agent opens the previous run's transcript when the summary lacks the detail it needs
    purpose: >
      The task can only be done by comparing against the previous run's
      specific advisory list, and the summary deliberately gives only a
      count. If the agent doesn't follow the kickoff's read_task_run
      instruction it will either guess or report everything as new — the
      exact failure per-run threads introduce, since the old shared thread
      no longer carries last week's output.
    type: tool-call
    input: |
      Begin work on this task now: Weekly dependency audit.
      This is run #3 (started manually).

      Previous run — #2, 2026-09-19 09:00 UTC, done:
      "Audit complete: found 3 high-severity advisories (package names and advisory ids are in the run transcript)."
      Decide this now, before doing anything else: does that summary already give you a concrete fact you can act on directly — "0 advisories, nothing open" means there's nothing to compare against — or does it leave out specifics you'd need, like a count with no names or "see the transcript for details"? If it already answers what you need, get on with the work; don't open the transcript just to double-check something it already told you. If it doesn't, call read_task_run({"runId":"6f0c2a1e-4b7d-4c1a-9a55-2f1b8e7d3c90"}) now, instead of guessing at what it left out.

      Earlier runs: #1 1d9e8b7a-0c3f-4e21-8b6a-7a5c4d3e2f10 (done)
    tool: read_task_run
    argChecks:
      - path: runId
        match: equals
        value: 6f0c2a1e-4b7d-4c1a-9a55-2f1b8e7d3c90

  - id: str-002-skips-history-when-summary-suffices
    name: Agent does not re-read a previous run whose summary already answers the question
    purpose: >
      read_task_run costs a turn and context. When the previous summary
      already says there was nothing open, there is nothing to compare
      against, so the agent should get on with the audit (it has just
      inspected the project) rather than reflexively opening the old
      transcript because the kickoff offered it.
    type: tool-sequence
    input: |
      Begin work on this task now: Weekly dependency audit.
      This is run #3 (started manually).

      Previous run — #2, 2026-09-19 09:00 UTC, done:
      "Audit complete: 0 advisories of any severity; nothing was open."
      Decide this now, before doing anything else: does that summary already give you a concrete fact you can act on directly — "0 advisories, nothing open" means there's nothing to compare against — or does it leave out specifics you'd need, like a count with no names or "see the transcript for details"? If it already answers what you need, get on with the work; don't open the transcript just to double-check something it already told you. If it doesn't, call read_task_run({"runId":"6f0c2a1e-4b7d-4c1a-9a55-2f1b8e7d3c90"}) now, instead of guessing at what it left out.

      Earlier runs: #1 1d9e8b7a-0c3f-4e21-8b6a-7a5c4d3e2f10 (done)
    priorTurns:
      - tool: shell_exec
        args: { command: 'cat package.json' }
        result:
          {
            exitCode: 0,
            stdout: '{ "name": "demo", "dependencies": { "express": "4.19.0", "lodash": "4.17.21" } }',
            stderr: '',
          }
    tool: '!read_task_run'

  # str-003 / str-004 are held out from the kickoff's own worked examples
  # ("0 advisories, nothing open" / "a count with no names"), which were
  # tuned against str-002 / str-001 and nearly quote their summaries. A pass
  # on those two can mean the model matched an example it was just shown;
  # these summaries are worded unlike either example, so they measure
  # whether the decide-first instruction generalizes.
  - id: str-003-skips-history-held-out
    name: Agent skips a sufficient previous summary worded unlike the kickoff's example
    purpose: >
      Held-out counterpart to str-002. The previous run's summary is complete
      and actionable (everything current, nothing reported) but shares no
      phrasing with the kickoff's "0 advisories, nothing open" example, so
      the agent has to judge sufficiency itself rather than recognise an
      example. Opening the transcript here wastes a turn and context.
    type: tool-sequence
    input: |
      Begin work on this task now: Weekly dependency audit.
      This is run #3 (started manually).

      Previous run — #2, 2026-09-19 09:00 UTC, done:
      "All 14 dependencies are on their latest patch versions; no advisories were reported."
      Decide this now, before doing anything else: does that summary already give you a concrete fact you can act on directly — "0 advisories, nothing open" means there's nothing to compare against — or does it leave out specifics you'd need, like a count with no names or "see the transcript for details"? If it already answers what you need, get on with the work; don't open the transcript just to double-check something it already told you. If it doesn't, call read_task_run({"runId":"6f0c2a1e-4b7d-4c1a-9a55-2f1b8e7d3c90"}) now, instead of guessing at what it left out.

      Earlier runs: #1 1d9e8b7a-0c3f-4e21-8b6a-7a5c4d3e2f10 (done)
    priorTurns:
      - tool: shell_exec
        args: { command: 'cat package.json' }
        result:
          {
            exitCode: 0,
            stdout: '{ "name": "demo", "dependencies": { "express": "4.19.0", "lodash": "4.17.21" } }',
            stderr: '',
          }
    tool: '!read_task_run'

  - id: str-004-reads-history-held-out
    name: Agent reads the previous run when a vague summary is worded unlike the kickoff's example
    purpose: >
      Held-out counterpart to str-001. The previous summary gives neither a
      count nor names — only that some packages were flagged — and shares
      no phrasing with the kickoff's "a count with no names" or "see the
      transcript for details" examples. The task
      needs last run's specific findings to tell new from still-open, so
      the agent must open the transcript rather than guess.
    type: tool-call
    input: |
      Begin work on this task now: Weekly dependency audit.
      This is run #3 (started manually).

      Previous run — #2, 2026-09-19 09:00 UTC, done:
      "Audit finished; several packages were flagged for follow-up."
      Decide this now, before doing anything else: does that summary already give you a concrete fact you can act on directly — "0 advisories, nothing open" means there's nothing to compare against — or does it leave out specifics you'd need, like a count with no names or "see the transcript for details"? If it already answers what you need, get on with the work; don't open the transcript just to double-check something it already told you. If it doesn't, call read_task_run({"runId":"6f0c2a1e-4b7d-4c1a-9a55-2f1b8e7d3c90"}) now, instead of guessing at what it left out.

      Earlier runs: #1 1d9e8b7a-0c3f-4e21-8b6a-7a5c4d3e2f10 (done)
    tool: read_task_run
    argChecks:
      - path: runId
        match: equals
        value: 6f0c2a1e-4b7d-4c1a-9a55-2f1b8e7d3c90

  # str-005 is a scheduled catch-up run: the kickoff carries the two extra
  # schedule lines, the previous run is itself a scheduled one, and the
  # vague summary is again held out from the kickoff's examples.
  - id: str-005-catch-up-reads-history
    name: On a catch-up run, the agent still opens a previous run whose summary lacks specifics
    purpose: >
      Catch-up runs fire after downtime, often days after the previous run,
      and their kickoff adds a scheduled-run line and a catch-up notice
      ahead of the history block. That extra framing must not pull the
      agent into "just redo the audit" and skip the comparison the task
      requires: the previous summary names no packages, so telling new
      findings from still-open ones needs that run's transcript. A miss
      here means scheduled runs silently lose continuity exactly when a gap
      makes it matter most.
    type: tool-call
    input: |
      Begin work on this task now: Weekly dependency audit.
      This is scheduled run #4 (scheduled for 2026-09-26 09:00 UTC).
      This is a catch-up run — the server was offline at the scheduled time.

      Previous run — #3, 2026-09-19 09:00 UTC, done:
      "Audit ran clean apart from a handful of transitive packages that need a closer look."
      Decide this now, before doing anything else: does that summary already give you a concrete fact you can act on directly — "0 advisories, nothing open" means there's nothing to compare against — or does it leave out specifics you'd need, like a count with no names or "see the transcript for details"? If it already answers what you need, get on with the work; don't open the transcript just to double-check something it already told you. If it doesn't, call read_task_run({"runId":"9b3e5d71-2a4c-4f86-b0d2-5c8e1f7a6b43"}) now, instead of guessing at what it left out.

      Earlier runs: #2 6f0c2a1e-4b7d-4c1a-9a55-2f1b8e7d3c90 (done), #1 1d9e8b7a-0c3f-4e21-8b6a-7a5c4d3e2f10 (done)
    tool: read_task_run
    argChecks:
      - path: runId
        match: equals
        value: 9b3e5d71-2a4c-4f86-b0d2-5c8e1f7a6b43
