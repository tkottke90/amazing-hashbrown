    # Originally authored as `tools: ['!rlm_query']` — a list shape the suite
    # schema has never supported. The negation intent is now expressible
    # directly: a '!'-prefixed `tool` passes only when that tool is NOT
    # called this turn (support added to ToolSequenceScenarioSchema and
    # executors/tool-sequence.ts for exactly this scenario). Answering in
    # plain text or reading further is fine; invoking rlm_query on a page
    # that was never truncated is the one failure this guards against.
    tool: '!rlm_query'

  - id: rlm-005-non-wiki-corpus
    name: Agent passes a large web_fetch result as the corpus to rlm_query
    purpose: >
      Confirms that rlm_query is wiki-agnostic — the agent can and should use it
      with any large text source, not only wiki pages. Seeds a large web_fetch
      result and asks a targeted factual question. The agent must call rlm_query
      with corpus drawn from the fetched content, not attempt to answer from
      its training data or the truncated preview.
    # Was `type: tool-call` — same silent priorTurns-stripping bug as rlm-002
    # (see the comment there). All three models correctly reported "nothing
    # was fetched in this conversation" because the seeded web_fetch turn
    # never reached them.
    type: tool-sequence
    input: >
      Based on what you fetched, what PostgreSQL version is required by the
      deployment guide?
    priorTurns:
      # Round-3 finding: the seeded fetch was ~1.1k chars with a meta note
      # claiming 22,000 more characters were "omitted here for eval brevity"
      # — the same unrealistic-world problem as rlm-002 (and web_fetch never
      # truncates in production, so a "continues beyond the result" marker
      # can never occur). Replaced with a genuinely long (~6.8k chars),
      # complete document with the PostgreSQL requirement buried mid-way,
      # matching web_fetch's real output format (Content/Metadata/Outline).
      - tool: web_fetch
        args: { url: 'https://docs.example.com/deployment/requirements' }
        result:
          text: |
            ## Content

            # Deployment Requirements

            This document describes the infrastructure requirements for a production deployment of the platform. It covers supported operating systems, hardware sizing, runtime dependencies, network and TLS configuration, storage layout, backup procedures, and monitoring integration. Read it end to end before provisioning; several requirements interact (for example, the storage layout constrains the backup tooling).

            ## System Requirements

            ### Operating System

            The platform is supported on Ubuntu 22.04 LTS and Ubuntu 24.04 LTS. Other Linux distributions may work but are not officially tested, and support requests reproduced only on untested distributions will be redirected to a supported one. Kernel 5.15 or newer is required for the io_uring-based file watcher; on older kernels the watcher falls back to polling, which increases CPU usage noticeably on large installations.

            ### CPU and Memory

            Minimum: 4 vCPU, 8 GB RAM. Recommended: 8 vCPU, 16 GB RAM for production workloads with more than 100 concurrent users. The ingest workers are memory-bound: budget roughly 512 MB per concurrent import job beyond the base recommendation. CPU pressure shows up first in search indexing latency, which is the metric to watch when deciding whether to scale up.

            ### Node.js Runtime

            Node.js 20 LTS (iron) or Node.js 22 LTS (jod) are supported. Node.js 18 has reached end-of-life and is not supported. The platform pins its own npm dependency tree; do not install global packages into the runtime image, as they can shadow bundled versions.

            ## Network Configuration

            ### Ports

            The application listens on 3000 (HTTP) and 3001 (metrics) by default; both are configurable. Only the reverse proxy should be reachable from outside the host network — the application ports themselves must not be exposed publicly, as the app relies on the proxy for TLS termination and request-size limits.

            ### Reverse Proxy

            nginx 1.24+ and Caddy 2.7+ are the tested reverse proxies. Enable HTTP/2, set client_max_body_size (or the Caddy equivalent) to at least 50 MB to accommodate archive imports, and forward the standard X-Forwarded-For and X-Forwarded-Proto headers — the application refuses to start in production mode if it detects a proxy that strips them.

            ### TLS

            TLS 1.2 is the floor; TLS 1.3 is strongly recommended. Certificates must cover both the apex domain and the wildcard subdomain if tenant subdomains are enabled. Automated renewal (certbot or Caddy's built-in ACME) is required for production support — expired-certificate outages caused by manual renewal processes are outside the support SLA.

            ### Firewall Rules

            Allow inbound 443 to the proxy, and nothing else from the public internet. Between application hosts, allow 3000-3001 (app and metrics), 5432 (database), and 6379 (cache). Egress must permit HTTPS to the license endpoint at license.example.com; air-gapped deployments should request an offline license bundle instead.

            ## Data Stores

            ### Database

            PostgreSQL 16 or later is required. PostgreSQL 15 is not supported. The platform uses features introduced in PostgreSQL 16 including logical replication improvements and new JSON functions. Provision the database with a dedicated role owning a single schema; the migration runner needs CREATE and ALTER on that schema but must not have superuser. Connection pooling through PgBouncer in transaction mode is supported and recommended above 200 concurrent users, with a pool of 2x vCPU count as the starting point.

            ### Cache

            Redis 7.2 or later, or Valkey 8, is required for session storage and the job queue. Persistence (AOF or RDB) is optional — all cached state is reconstructible — but enabling AOF shortens recovery time after a cache restart because sessions survive.

            ### Object Storage

            Attachments and export archives are written to S3-compatible object storage. AWS S3, Cloudflare R2, and MinIO 2024+ are tested. The bucket must enforce server-side encryption; the application refuses to write to a bucket that reports encryption disabled.

            ### Storage Layout

            The application host needs 20 GB for the application and logs, plus scratch space equal to the largest expected import archive times the number of concurrent import workers. Database storage grows at roughly 1 GB per 10,000 resources including index overhead; SSDs are required — the query planner assumptions and the default random_page_cost are tuned for solid-state latency.

            ## Backups

            ### Database Backups

            Use pg_dump for logical backups on installations under 50 GB, and switch to pgBackRest with WAL archiving beyond that. Nightly backups with 30-day retention are the supported baseline. Backups must be restored to a scratch database and smoke-tested at least monthly — an unrestorable backup is treated as no backup in support escalations.

            ### Object Storage Backups

            Enable bucket versioning and a 30-day lifecycle rule on noncurrent versions. Cross-region replication is recommended for single-region providers; R2 and S3 multi-region setups can skip it.

            ## Monitoring and Operations

            ### Metrics

            The metrics port serves Prometheus-format metrics at /metrics. The dashboards shipped in the ops/ directory assume Prometheus 2.50+ and Grafana 10+. The four golden signals for this platform are request latency p95, job queue depth, database connection saturation, and search indexing lag; alert thresholds for each are annotated in the shipped dashboard JSON.

            ### Logging

            Structured JSON logs are written to stdout and rotated by the host's journald or container runtime. Set LOG_LEVEL=info in production; debug level logs request bodies and is not safe for production traffic. Ship logs to your aggregator with the host and deployment labels the dashboards expect — the shipped Loki config shows the label set.

            ### Health Checks

            Liveness is GET /healthz (process up), readiness is GET /readyz (database, cache, and object storage reachable). Load balancers must use readiness, not liveness, for rotation decisions — a host that is alive but cannot reach the database will otherwise serve errors.

            ### Upgrades

            Upgrades are rolling: migrate the database first (migrations are backward-compatible for one minor version), then replace application hosts one at a time. Always read the version-specific upgrade notes; steps flagged BREAKING cannot be skipped or batched across multiple versions. Downgrades are supported only to the previous minor version and only before the next migration runs.

            ## Metadata
            title: "Deployment Requirements"
            description: "Infrastructure requirements for a production deployment of the platform."

            ## Document Outline
            H1: Deployment Requirements
            H2: System Requirements
            H2: Network Configuration
            H2: Data Stores
            H2: Backups
            H2: Monitoring and Operations
    tool: rlm_query
    argChecks:
      - path: corpus
        match: exists
      - path: corpus
        match: contains
        value: PostgreSQL
      - path: question
        match: exists
