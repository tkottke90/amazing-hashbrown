suite:
  id: provider-compatibility
  name: Provider Compatibility
  purpose: >
    Deliberately trivial, transport-level scenarios — run this suite FIRST
    against any new model/provider pairing (see issue #227). A
    malformed_tool_call or prose_question result here means the
    provider/server can't reliably emit structured tool calls (e.g. a
    chat-template mismatch), which is a configuration problem to fix at the
    provider/server level, not a prompting problem to chase by tuning the
    system prompt. Any failure on this suite should be investigated before
    trusting results from any other suite against the same provider.
  passingThreshold: 1.0

scenarios:
  - id: pc-001-single-tool-no-args
    name: Model calls a zero-argument tool via structured tool_calls
    purpose: >
      Simplest possible structured-call case. If this fails as
      malformed_tool_call, the provider cannot do structured tool calls at
      all for even the most trivial case — confirms the transport, not the
      model's reasoning, is broken.
    type: tool-call
    input: 'Browse the knowledge base. What domains are available? Do not search for anything specific yet.'
    tool: wiki_locate

  - id: pc-002-single-tool-one-string-arg
    name: Model calls a tool with a single string argument via structured tool_calls
    purpose: >
      Confirms the provider can pass a simple string argument through
      structured tool_calls, not just invoke a tool with no payload. Uses
      "favorite color" deliberately — system-prompt.ts's own
      WIKI_NAVIGATION_SECTION names this exact topic as the canonical
      domain-exclusive example that skips wiki_locate, so a compliant
      model goes straight to wiki_search regardless of provider. An
      earlier version of this scenario used "morning routines," which
      round 1 of the 2026-10-04 auto-eval run showed three of four
      providers (Lemonade, Ornith, Digital Ocean) routing through
      wiki_locate first — correctly, per the system prompt's own
      "not domain-exclusive" rule. That made it a navigation-logic test
      by accident, not the trivial transport test this scenario is meant
      to be — don't revert to an ambiguous topic.
    type: tool-call
    input: 'Search the knowledge base for anything about my favorite color.'
    tool: wiki_search
    argChecks:
      - path: query
        match: exists

  - id: pc-003-nested-object-args
    name: Model calls a tool with nested/object-shaped arguments via structured tool_calls
    purpose: >
      Confirms the provider can serialize a nested object argument
      (corpus.raw), not just a flat string/number arg — nested JSON is a
      more likely place for a provider to fall back to text-embedded
      output than a single flat argument.
    type: tool-call
    input: >
      Save this to the knowledge base as a new page in the "user" wiki: just
      write "this is a test note" as the body.
    tool: wiki_create_page
    argChecks:
      - path: wikiId
        match: equals
        value: user
      - path: corpus.raw
        match: exists

  - id: pc-004-two-step-follow-up
    name: Model correctly follows up with a second structured tool call given a seeded prior result
    purpose: >
      Confirms structured tool_calls survive a multi-turn exchange, not
      just a single cold-start turn — some providers degrade to
      text-embedded calls specifically on a follow-up turn after a seeded
      tool result, which a single-turn-only suite would never catch.
      Mirrors wiki-navigation's wnav-013 pattern exactly.
    type: tool-sequence
    turns:
      - user: 'What programming languages do I use most at work?'
      - tool: wiki_locate
        args: { context: 'programming languages used at work' }
        result:
          {
            text: 'Best match: "user" (domain: user, score 18). wiki_orient({ wikiId: "user" }) shows its structure if you need it.',
          }
    tool: wiki_search
    argChecks:
      - path: wikiId
        match: equals
        value: user
      - path: query
        match: exists

  - id: pc-005-unambiguous-clarification-calls-ask-user
    name: Model calls ask_user via structured tool_calls, not prose, when clarification is unambiguously called for
    purpose: >
      Checks the related-but-distinct prose_question failure mode: a model
      that would otherwise reason "I should ask the user" but emits the
      question as plain text instead of a structured ask_user call. Uses a
      seeded tool-sequence (the proven pattern from wiki-navigation's
      wnav-004 and instruction-hierarchy's ih-002) rather than a cold
      prompt, since a bare cold prompt has no working precedent in this
      harness and risks a false negative in a suite that only runs once
      (no gatedSkill here — this suite tests raw transport, not
      skill-gating).
    type: tool-sequence
    turns:
      - user: 'Look into the knowledge base for this and get back to me.'
      - tool: wiki_locate
        args: { context: 'training and fitness scheduling' }
        result:
          {
            text: 'Multiple domains match equally well: health-fitness, homelab. Narrow the context, or ask the user to pick one.',
          }
    tool: ask_user
    argChecks:
      - path: question
        match: exists

  - id: pc-006-structured-output
    name: Model produces valid structured output via withStructuredOutput()
    purpose: >
      Structured output is a transport capability distinct from
      tool-calling (after-agent.yaml, task-plan-generation.yaml, and
      production loop-reflection.ts all depend on withStructuredOutput()
      working), and llama.cpp-family servers in particular can support one
      reliably while failing the other. Deliberately trivial schema/input,
      matching pc-001..005's style — this checks the provider can emit
      schema-conformant structured output at all, not whether the model
      reasons well.
    type: structured
    outputSchema:
      type: object
      properties:
        topic: { type: string }
        isQuestion: { type: boolean }
      required: [topic, isQuestion]
    input: >
      Classify the following message. Respond using the structured fields:
      topic (a one or two word label for what the message is about) and
      isQuestion (true if the message ends with a question mark, false
      otherwise).


      Message: "What time does the coffee shop open?"
    fieldChecks:
      - path: isQuestion
        match: equals
        value: true

  - id: pc-007-long-input-context-probe
    name: Model retrieves a planted token from near the end of a long input
    purpose: >
      No scenario in this suite exceeds a one-line input. Local models are
      frequently run with small context windows, and rlm.yaml/web-fetch.yaml
      seed multi-KB documents routine in production — this is the trivial
      transport-level check for whether a provider silently truncates or
      drops the tail of a long input before the model ever sees it. Plants
      one unmistakable token near the end of ~8k+ tokens of filler and asks
      for it back; a dropped tail means the token is simply gone, caught by
      exact match. Not a reasoning or quality check — a provider that gets
      this wrong should be investigated at the transport/context-window
      level, same as a malformed_tool_call on pc-001.
    # Filler is generated, not hand-written: varied sentences (not one
    # repeated phrase, each tagged with a unique "(ref word-N)" marker) to
    # resist tokenizer compression, sized to comfortably exceed 8k tokens
    # (~38k characters) even allowing for some BPE compression on the
    # repeated sentence shapes.
    type: deterministic
    input: >
      The quarterly maintenance window for the northern water treatment facility was rescheduled to
      accommodate a delayed shipment of replacement filtration membranes. (ref orchard-0) Early
      explorers of the river delta kept detailed logs of tidal patterns, noting how seasonal
      rainfall shifted the channel's navigable width by several meters each year. (ref ledger-1) A
      well-tuned bicycle derailleur depends on correct cable tension, clean jockey wheels, and a
      hanger that hasn't been bent in a minor collision. (ref quarry-2) The committee reviewed three
      proposals for the community garden's irrigation redesign before settling on a drip-line layout
      that reduced water usage by nearly a third. (ref harbor-3) Migratory songbirds often rely on
      magnetic field sensing in addition to visual landmarks, a combination that helps them correct
      course after storms blow them off route. (ref foundry-4) The bakery's sourdough starter had
      been maintained continuously for eleven years, passed between three different owners who each
      kept a written feeding log. (ref meridian-5) Municipal archives from the early twentieth
      century show that the tram line originally terminated two blocks short of where the current
      station now stands. (ref thicket-6) A violin's tone depends heavily on the thickness gradient
      carved into its top plate, something luthiers test by tapping and listening before final
      assembly. (ref cistern-7) The hiking club's trail maintenance crew replaced four washed-out
      footbridges after an unusually wet spring raised the creek well above its normal banks. (ref
      granary-8) Beekeepers in the valley noticed that colonies placed near the orchard rows
      produced noticeably darker honey than those kept near the open meadow. (ref causeway-9) The
      observatory's old brass telescope mount required manual tracking corrections every few
      minutes, a tedious task later automated with a simple stepper motor retrofit. (ref pergola-10)
      A city planner's survey of the historic district found that nearly half the original
      cobblestone paving had been repaved with asphalt sometime in the 1960s. (ref limestone-11) The
      vineyard's harvest timing is decided almost entirely by sugar content readings taken daily
      from sample clusters picked at the same hour each morning. (ref aqueduct-12) Restoration
      carpenters working on the old mill matched the replacement floor joists to the original
      growth-ring spacing to keep the structure's flex characteristics consistent. (ref millpond-13)
      The regional chess club's annual tournament moved to a larger venue after registration numbers
      tripled following a local grandmaster's exhibition match. (ref switchback-14) A lighthouse
      keeper's logbook from the 1880s recorded not just weather but the names of every passing ship
      that signaled for identification. (ref tollgate-15) The ceramics studio's kiln schedule
      depends on glaze chemistry: some glazes need a slow cool-down over many hours to avoid crazing
      the surface. (ref windbreak-16) Urban beekeeping ordinances in the district require hives to
      be set back at least three meters from any shared property line. (ref cobbler-17) The marathon
      route was adjusted this year to avoid a bridge undergoing structural inspection, adding
      roughly four hundred meters to the total distance. (ref atrium-18) A glassblower's furnace
