suite:
  id: wiki-lint
  name: Wiki Lint Tooling
  purpose: >
    Verifies the chat agent calls wiki_lint to check wiki health when asked,
    establishing the domain via wiki_locate first when it isn't already known.
  passingThreshold: 0.85

scenarios:
  - id: wlint-001-check-wiki-health
    name: Agent lints the established domain when asked to check wiki health
    purpose: >
      Given the domain is already established via locate+orient prior turns, and
      asked to check the wiki for issues, confirms the agent calls wiki_lint with
      the matching wikiId. Uses tool-sequence (not tool-call, which has no
      priorTurns field in ToolCallScenarioSchema — silent strip would make the
      scenario run cold without established context, matching the same fix
      applied to wwrite-001 in suites/wiki-write.yaml).
    type: tool-sequence
    input: 'Can you check the wiki for any issues or problems?'
    priorTurns:
      - tool: wiki_locate
        args: { context: 'wiki health check' }
        result:
          text: 'Best match: "user" (domain: user, score 14). Use wiki_orient({ wikiId: "user" }) to see what''s inside.'
      - tool: wiki_orient
        args: { wikiId: 'user' }
        result:
          text: "# Wiki Orientation: user\n## Index (1 page total)\n- entities/work-schedule.md — user's work-from-home schedule"
    tool: wiki_lint
    argChecks:
      - path: wikiId
        match: equals
        value: user

  - id: wlint-002-locate-before-lint
    name: Agent locates the domain before linting when none is established
    purpose: >
      Asked to check the wiki for issues with no domain established yet, confirms
      the agent calls wiki_locate first rather than guessing a wikiId — matching
      the locate-before-act pattern from wnav-011/012 and wwrite-001. Plain
      tool-call with no priorTurns, matching how "nothing established yet"
      scenarios are written elsewhere (e.g. wnav-001 in wiki-navigation.yaml).
    type: tool-call
    input: 'Check the wiki for problems before I ask you anything else.'
    tool: wiki_locate

  - id: wlint-003-rebaseline-source-drift
    name: Agent calls wiki_rebaseline_source to fix a source_drift finding
    purpose: >
      Given a lint report with a source_drift finding, confirms the agent calls
      wiki_rebaseline_source with the correct wikiId and rawFilePath from the
      finding's page field — exercising the new SDK method and tool wrapper.
    type: tool-sequence
    input: 'Fix the raw source drift issue found in the user wiki.'
    priorTurns:
      - tool: wiki_locate
        args: { context: 'raw source drift' }
        result:
          text: 'Best match: "user" (domain: user, score 14). Use wiki_orient({ wikiId: "user" }) to see what''s inside.'
      - tool: wiki_lint
        args: { wikiId: 'user' }
        result:
          text: |
            ## Wiki Lint Report: user
            **Status:** ⚠ warnings present

            ### Warnings
            - [source_drift] raw/articles/some-article.md: Stored sha256 does not match file contents (raw/ was modified).
    tool: wiki_rebaseline_source
    argChecks:
      - path: wikiId
        match: equals
        value: user
      - path: rawFilePath
        match: equals
        value: raw/articles/some-article.md

  - id: wlint-004-register-untracked-domain
    name: Agent calls wiki_register_domain to fix a registry_sync finding
    purpose: >
      Given a lint report with a registry_sync finding, confirms the agent calls
      wiki_register_domain with the directory name from the finding as wikiId —
      exercising the new register() SDK method and tool wrapper.
    type: tool-sequence
    input: 'Register the untracked wiki directory the linter found.'
    priorTurns:
      - tool: wiki_locate
        args: { context: 'registry sync untracked wiki' }
        result:
          text: 'Best match: "user" (domain: user, score 12). Use wiki_orient({ wikiId: "user" }) to see what''s inside.'
      - tool: wiki_lint
        args: { wikiId: 'user' }
        result:
          text: |
            ## Wiki Lint Report: user
            **Status:** ⚠ warnings present

            ### Warnings
            - [registry_sync]: Wiki directory "projects" is on disk but missing from the registry.
    tool: wiki_register_domain
    argChecks:
      - path: wikiId
        match: equals
        value: projects

  - id: wlint-005-fix-orphaned-page
    name: Agent reads orphaned page then calls wiki_add_cross_link to fix it
    purpose: >
      Given a lint report with an orphans finding, confirms the agent calls
      wiki_add_cross_link with the orphaned page as fromPage — after reading it
      to identify a link target. Verifies the tool-sequence pattern where the
      agent must gather context before acting.
    type: tool-sequence
    input: 'Fix the orphaned page the linter found in the user wiki.'
    priorTurns:
      - tool: wiki_locate
        args: { context: 'orphaned page' }
        result:
          text: 'Best match: "user" (domain: user, score 13). Use wiki_orient({ wikiId: "user" }) to see what''s inside.'
      - tool: wiki_lint
        args: { wikiId: 'user' }
        result:
          text: |
            ## Wiki Lint Report: user
            **Status:** ⚠ warnings present

            ### Warnings
            - [orphans] entities/alice.md: Page has no inbound links from other pages.
      - tool: wiki_read_page
        args: { wikiId: 'user', path: 'entities/alice.md' }
        result:
          text: |
            # Alice
            Alice works closely with Bob on the platform team. She leads the frontend guild.
    tool: wiki_add_cross_link
    argChecks:
      - path: wikiId
        match: equals
        value: user
      - path: fromPage
        match: equals
        value: entities/alice.md

  - id: wlint-006-set-confidence-on-quality-finding
    name: Agent calls wiki_update_page with confidence to fix a quality finding
    purpose: >
      Given a lint report with a quality finding (missing confidence), confirms the
      agent calls wiki_update_page with the correct wikiId, path, and a confidence
      value — exercising the newly exposed confidence param on the tool schema.
    type: tool-sequence
    input: 'Address the quality issue the linter flagged for the bob page.'
    priorTurns:
      - tool: wiki_locate
        args: { context: 'quality finding confidence' }
        result:
          text: 'Best match: "user" (domain: user, score 12). Use wiki_orient({ wikiId: "user" }) to see what''s inside.'
      - tool: wiki_lint
        args: { wikiId: 'user' }
        result:
          text: |
            ## Wiki Lint Report: user
            **Status:** ⚠ warnings present

            ### Warnings
            - [quality] entities/bob.md: Missing confidence frontmatter field.
      - tool: wiki_read_page
        args: { wikiId: 'user', path: 'entities/bob.md' }
        result:
          text: |
            # Bob
            Bob is a senior engineer on the platform team. He owns the backend infrastructure.
    tool: wiki_update_page
    argChecks:
      - path: wikiId
        match: equals
        value: user
      - path: path
        match: equals
        value: entities/bob.md
      # oneOf, not equals: the lint report never says which confidence value to
      # pick, and wiki_update_page's own schema documents no default — "high" vs
      # "medium" for a short factual page is a judgment call, and round 1 of the
      # auto-eval loop saw glm and local both reason their way to "medium" while
      # ornith chose "high", all with defensible rationales. The scenario's
      # purpose is that a confidence value gets set at all (exercising the newly
      # exposed param), so accept either sensible tier; "low" stays excluded
      # because nothing in the page content justifies it.
      - path: confidence
        match: oneOf
        value: [high, medium]
