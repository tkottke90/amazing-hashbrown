suite:
  id: tool-calling
  name: Tool Calling
  purpose: >
    Verifies the chat agent actually invokes the correct built-in tool when a
    prompt calls for it, rather than just describing what it would do. New
    tools should add a scenario here alongside their implementation.
  passingThreshold: 1.0

scenarios:
  - id: tools-001-upload-image
    name: Agent calls upload_image to embed a generated image
    purpose: >
      Confirms the agent invokes the upload_image tool — not just claims to —
      when asked to produce and embed an image, and that the call includes a
      mimeType argument.
    type: tool-call
    input: >
      Generate a small solid red square image and embed it in your response
      using your image tool.
    tool: upload_image
    argChecks:
      - path: mimeType
        match: exists

  - id: tools-003-search-skills-no-keyword
    name: Agent calls search_skills when asked what skills are available
    purpose: >
      Confirms the agent invokes search_skills — with no keyword argument —
      when the user asks what skills or slash commands are available, rather
      than claiming it has no information or making something up. The tool is
      the only authoritative source; the agent must reach for it.
    type: tool-call
    input: >
      What skills or slash commands do you have available?
    tool: search_skills

  - id: tools-004-search-skills-keyword
    name: Agent calls search_skills with a relevant keyword when asked about topic-specific skills
    purpose: >
      Confirms the agent passes a keyword to search_skills when the user asks
      about skills for a specific topic (e.g. "summarizing"), rather than
      calling with no argument and returning everything. Tests that the agent
      uses the optional keyword to narrow results before reporting back.
    type: tool-call
    input: >
      Do you have any skills for summarizing content?
    tool: search_skills
    argChecks:
      - path: keyword
        match: exists

  - id: tools-005-create-tasks-after-plan-approved
    name: Agent calls create_tasks once a plan is approved
    purpose: >
      Confirms the agent invokes create_tasks — not just describes the plan
      — once the user has explicitly approved a multi-step breakdown of
      work, producing a batch of task entries rather than one giant task.
    type: tool-call
    input: >
      We just agreed on the plan: first add the migration, then write the
      handler, then add tests. Let's get started — go ahead and set that up
      as tasks.
    tool: create_tasks
    argChecks:
      - path: tasks
        match: exists

  - id: tools-002-comfyui-then-upload
    name: Agent uploads a previously-generated image via upload_image
    purpose: >
      Simulates a ComfyUI-style image-generation tool (generate_image) having
      already run and returned real bytes earlier in the conversation.
      Confirms the agent correctly follows up by calling upload_image with
      those exact bytes, rather than ignoring the result or fabricating new
      ones — the general "any image-producing tool must hand off to
      upload_image" contract.
    type: tool-sequence
    input: Generate an image of a red dragon and embed it in your response.
    priorTurns:
      - tool: generate_image
        args: { prompt: 'a red dragon' }
        result: { imageBase64: 'ZmFrZS1kcmFnb24tYnl0ZXM=', mimeType: 'image/png' }
    tool: upload_image
    argChecks:
      - path: imageBase64
        match: equals
        value: 'ZmFrZS1kcmFnb24tYnl0ZXM='
      - path: mimeType
        match: equals
        value: 'image/png'
