suite:
  id: tool-calling
  name: Tool Calling
  purpose: >
    Verifies the chat agent actually invokes the correct built-in tool when a
    prompt calls for it, rather than just describing what it would do. New
    tools should add a scenario here alongside their implementation.
  passingThreshold: 1.0

scenarios:
  - id: tools-001-upload-image
    name: Agent calls generate_image to kick off a from-scratch image request
    purpose: >
      Confirms the agent invokes generate_image — not just claims to — when
      asked to produce and embed an image with no image bytes already in the
      conversation. Originally asserted upload_image directly, but that's
      unsatisfiable on a cold-start turn: upload_image requires real
      imageBase64 bytes that only exist after generate_image (or an
      equivalent image-producing tool) has actually run, and this eval
      harness only inspects a single turn's tool_calls (see bin/eval.ts's
      evalTools comment; it never executes bound tools). All four models
      (local, Lemonade, Ornith, Digital Ocean) independently called
      generate_image first in auto-eval round 1 (2026-09-22) — corroborating
      that this is the correct first move, not a model gap. tools-002 is the
      companion scenario that tests the actual upload_image handoff, seeded
      with a prior generate_image result via priorTurns.
    type: tool-call
    input: >
      Generate a small solid red square image and embed it in your response
      using your image tool.
    tool: generate_image
    argChecks:
      - path: prompt
        match: exists

  - id: tools-003-search-skills-no-keyword
    name: Agent calls search_skills when asked what skills are available
    purpose: >
      Confirms the agent invokes search_skills — with no keyword argument —
      when the user asks what skills or slash commands are available, rather
      than claiming it has no information or making something up. The tool is
      the only authoritative source; the agent must reach for it.
    type: tool-call
    input: >
      What skills or slash commands do you have available?
    tool: search_skills

  - id: tools-004-search-skills-keyword
    name: Agent calls search_skills with a relevant keyword when asked about topic-specific skills
    purpose: >
      Confirms the agent passes a keyword to search_skills when the user asks
      about skills for a specific topic (e.g. "summarizing"), rather than
      calling with no argument and returning everything. Tests that the agent
      uses the optional keyword to narrow results before reporting back.
    type: tool-call
    input: >
      Do you have any skills for summarizing content?
    tool: search_skills
    argChecks:
      - path: keyword
        match: exists

  # tools-005-create-tasks-after-plan-approved: removed in auto-eval round 1
  # (2026-09-22). create_tasks is deliberately absent from the plain-chat
  # tool set both in production (chat-agent.ts: "'create_tasks' is
  # structurally absent from the plain-chat tool list" — it's only bound via
  # buildWorkspaceScopedTools() in buildWorkspaceChatAgent/buildTaskAgent)
  # and in this harness's evalTools (bin/eval.ts, which mirrors plain chat).
  # No wording change can make a model call a tool it was never given, so
  # this scenario could never pass under the current harness regardless of
  # the system prompt. suites/task-creation.yaml already covers create_tasks
  # correctly, explicitly scoped to workspace chat (see its purpose text and
  # docs/superpowers/specs/2026-09-22-agent-task-creation-design.md), with
  # both a positive and a premature-creation negative case — this scenario
  # was a redundant, mis-scoped duplicate of that coverage.

  - id: tools-002-comfyui-then-upload
    name: Agent uploads a previously-generated image via upload_image
    purpose: >
      Simulates a ComfyUI-style image-generation tool (generate_image) having
      already run and returned real bytes earlier in the conversation.
      Confirms the agent correctly follows up by calling upload_image with
      those exact bytes, rather than ignoring the result or fabricating new
      ones — the general "any image-producing tool must hand off to
      upload_image" contract.
    type: tool-sequence
    input: Generate an image of a red dragon and embed it in your response.
    priorTurns:
      - tool: generate_image
        args: { prompt: 'a red dragon' }
        result: { imageBase64: 'ZmFrZS1kcmFnb24tYnl0ZXM=', mimeType: 'image/png' }
    tool: upload_image
    argChecks:
      - path: imageBase64
        match: equals
        value: 'ZmFrZS1kcmFnb24tYnl0ZXM='
      - path: mimeType
        match: equals
        value: 'image/png'
