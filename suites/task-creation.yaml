suite:
  id: task-creation
  name: Agent Task Creation
  purpose: >
    Verifies the chat agent uses create_tasks correctly within workspace
    chat: only after a plan is approved (not mid-brainstorm), and passing a
    GitHub issue/PR URL already present in the conversation as trackerUrl
    rather than re-typing it into a task description from memory. See
    docs/superpowers/specs/2026-09-22-agent-task-creation-design.md.
  passingThreshold: 1.0

scenarios:
  - id: tc-001-no-premature-creation
    name: Agent does not call create_tasks mid-brainstorm before approval
    purpose: >
      Given the user is still exploring options and has not approved
      anything, confirms the agent continues discussing rather than
      prematurely creating tasks.
    type: tool-sequence
    priorTurns:
      - tool: wiki_search
        args: { query: 'auth refactor patterns' }
        result: { text: 'No relevant wiki pages found.' }
    input: >
      I'm thinking about how to tackle the auth refactor — maybe split it
      into a migration step and a handler step? What do you think?
    tool: '!create_tasks'

  - id: tc-002-tracker-url-passed-not-retyped
    name: Agent passes a GitHub issue URL as trackerUrl instead of re-describing it
    purpose: >
      Given a GitHub issue URL was mentioned earlier in the conversation and
      the user now approves a plan to work on it, confirms create_tasks is
      called with that exact URL as trackerUrl rather than the agent
      re-typing/paraphrasing the issue from memory into each task's
      description.
    type: tool-sequence
    priorTurns:
      - tool: web_fetch
        args: { url: 'https://github.com/octo/repo/issues/42' }
        result: { text: 'Issue #42: Refactor auth. Plan: migration, handler, tests.' }
    input: >
      Yes, let's go with that plan — set up the tasks.
    tool: create_tasks
    argChecks:
      - path: trackerUrl
        match: equals
        value: 'https://github.com/octo/repo/issues/42'

  - id: tc-003-recurring-request-sets-cron-repeat-trigger
    name: Agent sets a cron_repeat trigger for a recurring request, instead of inventing a schedule
    purpose: >
      Given the user asks for a task that repeats on a schedule, confirms
      create_tasks is called with a real cron_repeat trigger rather than
      creating a plain one-shot task and merely describing it as recurring
      in the reply. Reproduces the bug in
      https://github.com/tkottke90/amazing-hashbrown/issues/240 — see
      docs/superpowers/specs/2026-10-01-chat-scheduled-tasks-design.md.
    type: tool-call
    input: >
      Set up a task that checks the build status every day at 9am UTC and
      posts a summary. This should keep running every day, not just once.
    tool: create_tasks
    argChecks:
      - path: tasks.0.trigger.type
        match: equals
        value: 'cron_repeat'
      - path: tasks.0.trigger.expression
        match: exists
    responseRubric: >
      The reply should describe the task as recurring/scheduled to run daily,
      not as a one-time or immediate task.
    responseMinScore: 7

  - id: tc-004-future-dated-request-sets-cron-once-trigger
    name: Agent sets a cron_once trigger for a future-dated request, instead of running it now
    purpose: >
      Given the user asks for a task to run once at a specific future time,
      confirms create_tasks is called with a real cron_once trigger carrying
      a future fireAt, rather than creating a task that runs immediately
      while the reply falsely claims it was scheduled. Reproduces the bug in
      https://github.com/tkottke90/amazing-hashbrown/issues/240.
    type: tool-call
    input: >
      Create a task that sends the status update, but don't run it now —
      schedule it for tomorrow at 3pm.
    tool: create_tasks
    argChecks:
      - path: tasks.0.trigger.type
        match: equals
        value: 'cron_once'
      - path: tasks.0.trigger.fireAt
        match: exists
    responseRubric: >
      The reply should describe the task as scheduled for tomorrow afternoon,
      not as something that already ran or will run immediately.
    responseMinScore: 7
