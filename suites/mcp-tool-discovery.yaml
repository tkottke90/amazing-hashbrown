suite:
  id: mcp-tool-discovery
  name: MCP Tool Discovery (#408)
  purpose: >
    Verifies the model actually follows the new discovery-before-use
    contract (issue #408, docs/superpowers/specs/2026-11-11-mcp-tool-
    discovery-design.md, ADR-0067) rather than just that the plumbing
    exists — mcp-tool-discovery.test.ts and mcp-tool-discovery.middleware.
    test.ts already cover the mechanical "a Discovered id gets added to
    request.tools" behavior at the unit level. These scenarios exercise
    real model behavior: does it search then explicitly grant an MCP tool
    before expecting to call it (mtd-001), and does an unrelated request
    leave the discovery/grant path untouched rather than speculatively
    pulling something in (mtd-002). Neither scenario could actually pass
    before now: bin/eval-setup.ts's evalTools fixture list omitted
    search_mcp_tools and use_mcp_tools themselves (they're static,
    always-bound production tools per chat-agent.ts, not the dynamic/live-
    server-dependent MCP tools that list deliberately excludes), so neither
    was ever offered to the model as a callable option. No real MCP server
    is needed to run this suite — tool-call/tool-sequence scenarios only
    inspect the model's proposed tool_calls and never execute a tool.
    mtd-003/mtd-004 extend this to the direct-bind path: an MCP tool already
    bound via Skill-Gated Tools (issue #409/#431), including the ADR-0074
    admin-disable override that still wins while the gating skill is Active.
  passingThreshold: 0.85

scenarios:
  - id: mtd-001-search-then-grant-before-use
    name: 'A request needing an undiscovered MCP tool searches, then explicitly grants it, before attempting to use it'
    purpose: >
      Per the new mcp_tool_discovery system-prompt section
      (system-prompt.ts), an MCP tool outside the default bound set must be
      granted via use_mcp_tools — found via a prior search_mcp_tools call —
      before the model can call it at all; it is not bound yet at the start
      of this turn. Seeds the search step (the keyword search itself isn't
      what this scenario is testing) and asserts the very next call is
      use_mcp_tools, not a direct attempt at the real tool (which isn't
      bound yet and couldn't be called anyway) and not a refusal/"I don't
      have that tool" response.
    type: tool-sequence
    turns:
      - user: >
          Use the n8n workflow-search tool to find workflows related to
          "invoice processing".
      - tool: search_mcp_tools
        args: { keyword: 'workflow' }
        result:
          text: >
            [{"toolId":"n8n:workflow_search","name":"workflow_search","description":"Search n8n workflows by keyword"}]
    tool: use_mcp_tools

  - id: mtd-002-unrelated-request-does-not-speculatively-grant
    name: 'An unrelated request does not speculatively grant an MCP tool'
    purpose: >
      A request with no connection to any MCP tool must not result in a
      use_mcp_tools call — granting access "just in case" would quietly
      defeat the point of discovery being opt-in per turn. search_mcp_tools
      itself is read-only and ungated, so a model that searches out of
      curiosity isn't the failure mode being tested here; only an actual
      grant is.
    type: tool-call
    input: 'What is 17 times 24?'
    tool: '!use_mcp_tools'

  - id: mtd-003-skill-gated-mcp-tool-called-directly
    name: 'An MCP tool already bound via Skill-Gated Tools is called directly, with no discovery round-trip'
    purpose: >
      The complementary case to mtd-001: #409/#431 lets a skill's own `tools`
      frontmatter field gate an MCP tool directly, binding it the instant the
      skill is Active, with no search_mcp_tools/use_mcp_tools step at all.
      Confirms the model treats an already-bound skill-gated MCP tool like
      any other available tool, rather than reflexively running the newer
      discovery-first habit mtd-001/mtd-002 exist to establish.
    type: tool-call
    input: >
      Use the n8n workflow-search tool to find workflows related to
      "invoice processing".
    gatedSkill: n8n-workflow-sync
    gatedMcpTools:
      - toolId: 'n8n:workflow_search'
        description: 'Search n8n workflows by keyword'
        argsSchema:
          type: object
          properties:
            keyword: { type: string }
          required: [keyword]
    tool: n8n__workflow_search

  - id: mtd-004-admin-disable-overrides-skill-gate
    name: "An admin's explicit disable keeps a skill-gated MCP tool unbound even while its skill is Active"
    purpose: >
      ADR-0074: skill-gating an MCP tool is not a full Tool Access exemption
      the way a built-in skill-gated tool gets — an admin's explicit disable
      still wins. Only skill-gated-mcp-tools.middleware.test.ts covers this
      today, at the unit level; this is the first check against real model
      behavior.
    type: tool-call
    input: >
      Use the n8n workflow-search tool to find workflows related to
      "invoice processing".
    gatedSkill: n8n-workflow-sync
    gatedMcpTools:
      - toolId: 'n8n:workflow_search'
        description: 'Search n8n workflows by keyword'
        enabled: false
        argsSchema:
          type: object
          properties:
            keyword: { type: string }
          required: [keyword]
    tool: '!n8n__workflow_search'
