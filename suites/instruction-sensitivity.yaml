suite:
  id: instruction-sensitivity
  name: Instruction Sensitivity (wiki stub)
  purpose: >
    2×2 regression matrix confirming the embedded 'to ingest into wiki' stub
    instruction drives wiki_create_page calls, and that wiki tool
    availability alone does not cause unprompted ingestion. The Option A vs.
    Option B design question this suite originally existed to resolve is
    settled in code: system-prompt.ts's WIKI_INGEST_SECTION always includes
    the ingest instruction when a stub carries the literal heading (Option
    A), with a carve-out for when wiki_create_page isn't bound at all. E-13
    guards that decision rather than deciding it — a failure here means
    Option A's assumption no longer holds for at least one model and should
    be re-evaluated, not that the question is still open.
  passingThreshold: 0.75

scenarios:
  - id: E-11
    name: 'Instruction present + tools registered → wiki_create_page called'
    purpose: >
      Validates that the embedded stub instruction causes the model to call
      wiki_create_page with the KV corpus reference. Positive control — should
      reliably pass.
    type: tool-sequence
    turns:
      - user: 'Look up information about distributed systems and give me a summary.'
      - tool: web_fetch
        args:
          url: 'https://example.com/distributed-systems'
        result:
          content: |
            ── CONTENT OFFLOADED ──────────────────
            tool:     web_fetch
            chars:    18,432
            key:      kv_7f3a9b2c
            threadId: f50450ee-582d-49b3-9bb2
            type:     technical reference
            rlm:      yes
            ─ summary ─────────────────────────────
            Comprehensive guide covering CAP theorem fundamentals,
            consensus protocols (Paxos, Raft), and migration case studies.
            ─ key concepts ────────────────────────
            consistency, availability, partition tolerance, leader election
            ─ to ingest into wiki: ─────────────────
              wiki_create_page({
                title:  <title>,
                corpus: {
                  threadId: "f50450ee-582d-49b3-9bb2",
                  toolKey:  "kv_7f3a9b2c"
                }
              })
    tool: wiki_create_page

  - id: E-12
    name: 'Instruction present + tools NOT registered → wiki_create_page NOT attempted'
    purpose: >
      Confirms the stub instruction does not cause hallucination when wiki tools
      are absent. With no wiki_create_page in the tool schema, the model cannot
      call it — this scenario validates the test setup and checks for any
      invalid_tool_call attempts (hallucinated function calls).
    type: tool-sequence
    excludeTools:
      - wiki_create_page
      - wiki_update_page
      - wiki_search
      - wiki_read_page
      - wiki_locate
      - wiki_orient
      - wiki_lint
      - wiki_add_cross_link
      - wiki_rebaseline_source
      - wiki_register_domain
    turns:
      - user: 'Look up information about distributed systems and give me a summary.'
      - tool: web_fetch
        args:
          url: 'https://example.com/distributed-systems'
        result:
          content: |
            ── CONTENT OFFLOADED ──────────────────
            tool:     web_fetch
            chars:    18,432
            key:      kv_7f3a9b2c
            threadId: f50450ee-582d-49b3-9bb2
            type:     technical reference
            rlm:      yes
            ─ summary ─────────────────────────────
            Comprehensive guide covering CAP theorem fundamentals,
            consensus protocols (Paxos, Raft), and migration case studies.
            ─ key concepts ────────────────────────
            consistency, availability, partition tolerance, leader election
            ─ to ingest into wiki: ─────────────────
              wiki_create_page({
                title:  <title>,
                corpus: {
                  threadId: "f50450ee-582d-49b3-9bb2",
                  toolKey:  "kv_7f3a9b2c"
                }
              })
    tool: '!wiki_create_page'

  - id: E-13
    name: 'No instruction + tools registered → wiki_create_page NOT called unprompted'
    purpose: >
      Regression guard for the Option A design decision (see suite
      purpose): confirms wiki tool availability alone, without an embedded
      stub instruction, does not cause the model to volunteer
      wiki_create_page. A failure here means Option A's assumption no
      longer holds for at least one model and should be re-evaluated, not
      that the decision is still pending.
    type: tool-sequence
    turns:
      - user: 'Look up information about distributed systems and give me a summary.'
      - tool: web_fetch
        args:
          url: 'https://example.com/distributed-systems'
        result:
          content: |
            ── CONTENT OFFLOADED ──────────────────
            tool:     web_fetch
            chars:    18,432
            key:      kv_7f3a9b2c
            threadId: f50450ee-582d-49b3-9bb2
            type:     technical reference
            rlm:      yes
            ─ summary ─────────────────────────────
            Comprehensive guide covering CAP theorem fundamentals,
            consensus protocols (Paxos, Raft), and migration case studies.
            ─ key concepts ────────────────────────
            consistency, availability, partition tolerance, leader election
    tool: '!wiki_create_page'

  - id: E-14
    name: 'No instruction + tools NOT registered → baseline clean response'
    purpose: >
      Negative control. Neither instruction nor wiki tools present. Should always
      pass — verifies the test harness is healthy and the model behaves normally
      without either trigger.
    type: tool-sequence
    excludeTools:
      - wiki_create_page
      - wiki_update_page
      - wiki_search
      - wiki_read_page
      - wiki_locate
      - wiki_orient
      - wiki_lint
      - wiki_add_cross_link
      - wiki_rebaseline_source
      - wiki_register_domain
    turns:
      - user: 'Look up information about distributed systems and give me a summary.'
      - tool: web_fetch
        args:
          url: 'https://example.com/distributed-systems'
        result:
          content: |
            ── CONTENT OFFLOADED ──────────────────
            tool:     web_fetch
            chars:    18,432
            key:      kv_7f3a9b2c
            threadId: f50450ee-582d-49b3-9bb2
            type:     technical reference
            rlm:      yes
            ─ summary ─────────────────────────────
            Comprehensive guide covering CAP theorem fundamentals,
            consensus protocols (Paxos, Raft), and migration case studies.
            ─ key concepts ────────────────────────
            consistency, availability, partition tolerance, leader election
    tool: '!wiki_create_page'
