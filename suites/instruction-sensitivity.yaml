suite:
  id: instruction-sensitivity
  name: Instruction Sensitivity (wiki stub)
  purpose: >
    2×2 matrix testing whether the embedded 'to ingest into wiki' stub instruction
    drives wiki_create_page calls, and whether wiki tool availability alone causes
    unprompted ingestion. E-13 is the deciding case for Option A vs Option B:
    if E-13 fails (model volunteers wiki_create_page without an explicit instruction),
    Option B (conditional instruction) is required; if E-13 passes reliably,
    Option A (always include) is safe.
  passingThreshold: 0.75

scenarios:
  - id: E-11
    name: "Instruction present + tools registered → wiki_create_page called"
    purpose: >
      Validates that the embedded stub instruction causes the model to call
      wiki_create_page with the KV corpus reference. Positive control — should
      reliably pass.
    type: tool-sequence
    input: "Look up information about distributed systems and give me a summary."
    priorTurns:
      - tool: web_fetch
        args:
          url: "https://example.com/distributed-systems"
        result:
          content: |
            ── CONTENT OFFLOADED ──────────────────
            tool:     web_fetch
            chars:    18,432
            key:      kv_7f3a9b2c
            threadId: f50450ee-582d-49b3-9bb2
            type:     technical reference
            rlm:      yes
            ─ summary ─────────────────────────────
            Comprehensive guide covering CAP theorem fundamentals,
            consensus protocols (Paxos, Raft), and migration case studies.
            ─ key concepts ────────────────────────
            consistency, availability, partition tolerance, leader election
            ─ to ingest into wiki: ─────────────────
              wiki_create_page({
                title:  <title>,
                corpus: {
                  threadId: "f50450ee-582d-49b3-9bb2",
                  toolKey:  "kv_7f3a9b2c"
                }
              })
    tool: wiki_create_page

  - id: E-12
    name: "Instruction present + tools NOT registered → wiki_create_page NOT attempted"
    purpose: >
      Confirms the stub instruction does not cause hallucination when wiki tools
      are absent. With no wiki_create_page in the tool schema, the model cannot
      call it — this scenario validates the test setup and checks for any
      invalid_tool_call attempts (hallucinated function calls).
    type: tool-sequence
    excludeTools:
      - wiki_create_page
      - wiki_update_page
      - wiki_search
      - wiki_read_page
      - wiki_locate
      - wiki_orient
      - wiki_lint
      - wiki_add_cross_link
      - wiki_rebaseline_source
      - wiki_register_domain
    input: "Look up information about distributed systems and give me a summary."
    priorTurns:
      - tool: web_fetch
        args:
          url: "https://example.com/distributed-systems"
        result:
          content: |
            ── CONTENT OFFLOADED ──────────────────
            tool:     web_fetch
            chars:    18,432
            key:      kv_7f3a9b2c
            threadId: f50450ee-582d-49b3-9bb2
            type:     technical reference
            rlm:      yes
            ─ summary ─────────────────────────────
            Comprehensive guide covering CAP theorem fundamentals,
            consensus protocols (Paxos, Raft), and migration case studies.
            ─ key concepts ────────────────────────
            consistency, availability, partition tolerance, leader election
            ─ to ingest into wiki: ─────────────────
              wiki_create_page({
                title:  <title>,
                corpus: {
                  threadId: "f50450ee-582d-49b3-9bb2",
                  toolKey:  "kv_7f3a9b2c"
                }
              })
    tool: "!wiki_create_page"

  - id: E-13
    name: "No instruction + tools registered → wiki_create_page NOT called unprompted"
    purpose: >
      THE KEY SCENARIO. Tests whether wiki tool availability alone (without an
      embedded stub instruction) causes the model to volunteer wiki_create_page.
      Fail = Option B required; Pass = Option A safe. Run across multiple models
      and aggregate results before making the design decision.
    type: tool-sequence
    input: "Look up information about distributed systems and give me a summary."
    priorTurns:
      - tool: web_fetch
        args:
          url: "https://example.com/distributed-systems"
        result:
          content: |
            ── CONTENT OFFLOADED ──────────────────
            tool:     web_fetch
            chars:    18,432
            key:      kv_7f3a9b2c
            threadId: f50450ee-582d-49b3-9bb2
            type:     technical reference
            rlm:      yes
            ─ summary ─────────────────────────────
            Comprehensive guide covering CAP theorem fundamentals,
            consensus protocols (Paxos, Raft), and migration case studies.
            ─ key concepts ────────────────────────
            consistency, availability, partition tolerance, leader election
    tool: "!wiki_create_page"

  - id: E-14
    name: "No instruction + tools NOT registered → baseline clean response"
    purpose: >
      Negative control. Neither instruction nor wiki tools present. Should always
      pass — verifies the test harness is healthy and the model behaves normally
      without either trigger.
    type: tool-sequence
    excludeTools:
      - wiki_create_page
      - wiki_update_page
      - wiki_search
      - wiki_read_page
      - wiki_locate
      - wiki_orient
      - wiki_lint
      - wiki_add_cross_link
      - wiki_rebaseline_source
      - wiki_register_domain
    input: "Look up information about distributed systems and give me a summary."
    priorTurns:
      - tool: web_fetch
        args:
          url: "https://example.com/distributed-systems"
        result:
          content: |
            ── CONTENT OFFLOADED ──────────────────
            tool:     web_fetch
            chars:    18,432
            key:      kv_7f3a9b2c
            threadId: f50450ee-582d-49b3-9bb2
            type:     technical reference
            rlm:      yes
            ─ summary ─────────────────────────────
            Comprehensive guide covering CAP theorem fundamentals,
            consensus protocols (Paxos, Raft), and migration case studies.
            ─ key concepts ────────────────────────
            consistency, availability, partition tolerance, leader election
    tool: "!wiki_create_page"
