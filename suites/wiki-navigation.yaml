suite:
  id: wiki-navigation
  name: Wiki Navigation
  purpose: >
    Verifies the chat agent coordinates wiki_locate, wiki_orient,
    wiki_search, and wiki_read_page correctly in sequence — picking a
    domain before orienting, orienting before reading, and recovering
    sensibly from ambiguous, no-match, and unknown-id results rather than
    guessing.
  passingThreshold: 0.85

scenarios:
  - id: wnav-001-locate-picks-domain
    name: Agent calls wiki_locate for an unfamiliar topic
    purpose: >
      Confirms the agent reaches for wiki_locate with a context argument
      before assuming a domain.
    type: tool-call
    input: 'I need to look something up about my personal preferences. Which part of the knowledge base should I check?'
    tool: wiki_locate
    argChecks:
      - path: context
        match: exists

  - id: wnav-002-orient-after-locate
    name: Agent orients on the domain wiki_locate matched
    purpose: >
      Given wiki_locate already returned a clean match, confirms the next
      call is wiki_orient on that exact domain.
    type: tool-sequence
    input: 'What do we already know in the knowledge base before I ask my question?'
    priorTurns:
      - tool: wiki_locate
        args: { context: 'personal preferences' }
        result:
          {
            text: 'Best match: "user" (domain: user, score 18). Use wiki_orient({ wikiId: "user" }) to see what''s inside.',
          }
    tool: wiki_orient
    argChecks:
      - path: wikiId
        match: equals
        value: user

  - id: wnav-003-read-page-after-orient
    name: Agent reads the matching page found via orient
    purpose: >
      Given locate + orient already ran and the index shows a relevant
      page, confirms the agent reads that specific page rather than
      re-searching or guessing.
    type: tool-sequence
    input: 'What do I prefer for my morning routine?'
    priorTurns:
      - tool: wiki_locate
        args: { context: 'morning routine preferences' }
        result:
          {
            text: 'Best match: "user" (domain: user, score 18). Use wiki_orient({ wikiId: "user" }) to see what''s inside.',
          }
      - tool: wiki_orient
        args: { wikiId: 'user' }
        result:
          {
            text: "# Wiki Orientation: user\n## Index\n- entities/morning-routine.md — user's morning routine preferences",
          }
    tool: wiki_read_page
    argChecks:
      - path: wikiId
        match: equals
        value: user
      - path: path
        match: equals
        value: entities/morning-routine.md

  - id: wnav-004-ambiguous-locate-asks-user
    name: Agent asks for clarification on an ambiguous domain match
    purpose: >
      Given wiki_locate returns tied candidates, confirms the agent asks
      the user to disambiguate rather than picking one arbitrarily.
    type: tool-sequence
    input: 'Look into the knowledge base for this and get back to me.'
    priorTurns:
      - tool: wiki_locate
        args: { context: 'training and fitness scheduling' }
        result:
          {
            text: 'Multiple domains match equally well: health-fitness, homelab. Narrow the context, or ask the user to pick one.',
          }
    tool: ask_user
    argChecks:
      - path: question
        match: exists

  - id: wnav-005-no-match-reports-honestly
    name: Agent reports honestly when no domain matches
    purpose: >
      For a wildly unrelated topic, wiki_locate naturally returns no match
      against the real registry. The agent must say so plainly instead of
      fabricating an answer from an unrelated domain.
    # Un-skipped: exercises IDENTITY_SECTION + MEMORY_SECTION
    # (api/src/agents/system-prompt.ts), added to fix cold-start
    # fabrication. A real eval run passed this at 7/10 (minScore was 6)
    # despite the judge's own reasoning stating criterion 1 was unmet — the
    # model broke persona entirely ("I'm a large language model... I can't
    # perform real-time searches") instead of using the wiki-as-memory
    # framing at all. Criterion 1 is now an explicit hard gate rather than
    # one of three weighted factors, and minScore raised to match the
    # schema's own default. If this still fails after a real eval run,
    # iterate the section wording, not this scenario.
    type: llm-judge
    input: 'Search the knowledge base for information about deep-sea marine biology research.'
    rubric: >
      Hard requirement, not just one factor among several: the response
      must explicitly state that no wiki domain covers this topic or that
      nothing relevant was found. A response that never acknowledges the
      wiki at all — reverting to a generic "I'm an AI language model and
      can't do that" disclaimer, or answering the question from general
      knowledge without mentioning the wiki — has failed regardless of how
      well-written or factually accurate it is. Score no higher than 3/10
      if that acknowledgment is missing.

      Given that acknowledgment is present, also check: (1) it doesn't
      fabricate content by treating an unrelated domain as if it matched,
      (2) it optionally offers alternative help. Full marks require both.
    minScore: 7

  - id: wnav-006-unknown-wikiid-recovers
    name: Agent recovers from an unknown wikiId by calling wiki_locate
    purpose: >
      If wiki_orient is called with a bad id and returns its own
      "not registered" error, confirms the agent's next call is
      wiki_locate rather than retrying blindly or giving up. Only the
      tool choice is asserted — wiki_locate's own schema documents
      `context` as optional ("Omit to browse all registered domains"),
      so calling it argless here is a legitimate recovery, not a
      fallback. An earlier version of this scenario required a
      `context` arg to exist and failed a run where the model chose
      browse mode deliberately ("let me check what domains are
      available") — that was a stricter requirement than the tool's
      own contract, not a real gap.
    type: tool-sequence
    input: 'Check the archive wiki for anything relevant.'
    priorTurns:
      - tool: wiki_orient
        args: { wikiId: 'archive' }
        result:
          { text: 'Wiki "archive" is not registered. Use wiki_locate to find available domains.' }
    tool: wiki_locate

  - id: wnav-007-organic-locate-genuinely-ambiguous
    name: Agent calls wiki_locate on live, unseeded, genuinely ambiguous input
    purpose: >
      Unlike wnav-001 (which explicitly says "which part of the knowledge
      base should I check" — a giveaway), this uses natural phrasing on a
      topic that could plausibly belong to either the user or self domain
      ("growth" appears in both domains' routing signals in spirit). No
      priorTurns are seeded — this tests whether the harness system prompt
      actually steers live, organic tool choice, not just a seeded
      continuation.
    # Un-skipped: exercises IDENTITY_SECTION + MEMORY_SECTION
    # (api/src/agents/system-prompt.ts). Note: an earlier --llm-review pass
    # also flagged this input as a coin-flip phrasing between "check the
    # wiki" and "answer conversationally," independent of the prompt fix —
    # if this still fails after a real eval run and the failure looks like
    # an input-ambiguity artifact rather than a prompt gap, reword the
    # input as a separate follow-up rather than iterating the section.
    type: tool-call
    input: 'What have you noticed about growth lately?'
    tool: wiki_locate
    argChecks:
      - path: context
        match: exists

  - id: wnav-008-no-overcall-on-obvious-topic
    name: Agent skips wiki_locate on an unambiguous topic
    purpose: >
      The harness prompt explicitly says to skip wiki_locate when the
      domain is already obvious. This asserts the model goes straight to
      wiki_search for a clearly single-domain query rather than always
      routing through wiki_locate first — guarding against the prompt
      overcorrecting into forced, unnecessary tool-chaining.
    # Un-skipped: exercises IDENTITY_SECTION + MEMORY_SECTION
    # (api/src/agents/system-prompt.ts), added to fix the model calling no
    # tool at all and answering "I don't have access..." instead of
    # checking the wiki. If this still fails after a real eval run,
    # iterate the section wording, not this scenario.
    type: tool-call
    input: "What's my favorite color?"
    tool: wiki_search
    argChecks:
      - path: query
        match: exists

  - id: wnav-009-scoped-orient-follows-routing-hints
    name: Agent orients only into the domain routing hints actually point to
    purpose: >
      Given wiki_locate surfaces both "user" and "self" as candidate domains
      but the routing notes cleanly attribute the question to only one of
      them, confirms wiki_orient's wikiId is constrained to that domain —
      guards against orienting into an irrelevant domain (self) for a
      question routing hints say belongs only to another (user). Motivated
      by a real thread transcript where the agent, asked a purely
      user-directed question, additionally oriented into "self" (the
      agent's own identity/reflection domain) and then confusingly wrote
      that domain's empty state into the reply as if it were relevant to
      the user.
    type: tool-sequence
    input: 'What have I told you I prefer for my morning routine?'
    priorTurns:
      - tool: wiki_locate
        args: { context: 'morning routine preferences' }
        result:
          text: >-
            Candidates: "user" (domain: user, score 14) — routing note:
            user preferences, personal context, and biography. "self"
            (domain: agent identity, values, decisions, and reflection,
            score 3) — routing note: the agent's own reasoning, values,
            principles, decisions, mistakes, and growth. This question is
            about the user's own stated preference, which only the
            "user" routing note covers.
    tool: wiki_orient
    argChecks:
      - path: wikiId
        match: oneOf
        value: ['user']

  - id: wnav-010-procedural-question-triggers-locate
    name: Agent checks the wiki for a stored how-to before answering from general knowledge
    purpose: >
      Verifies MEMORY_SECTION's "check the wiki first" framing generalizes
      past personal-fact phrasing ("what do I prefer") to procedural/how-to
      phrasing — a stored, previously-documented procedure should be
      treated the same as a stored personal fact, not answered from the
      model's own general knowledge of NPM/Verdaccio. First-person
      need-statement phrasing.
    type: tool-call
    input: 'I need to generate a new NPM token for my Verdaccio instance.'
    tool: wiki_locate
    argChecks:
      - path: context
        match: exists

  - id: wnav-010b-procedural-question-triggers-locate-how-do-i
    name: Agent checks the wiki for a stored how-to (interrogative phrasing)
    purpose: >
      Same intent as wnav-010, different phrasing — an interrogative
      "how do I" framing rather than a first-person need statement, to
      confirm the routing isn't an artifact of one specific phrasing.
    type: tool-call
    input: 'How do I generate a new NPM token for Verdaccio?'
    tool: wiki_locate
    argChecks:
      - path: context
        match: exists

  - id: wnav-010c-procedural-question-triggers-locate-past-tense
    name: Agent checks the wiki for a stored how-to (past-tense recall phrasing)
    purpose: >
      Same intent as wnav-010, phrased as a recall of a previously
      established process rather than a fresh request — this phrasing
      most directly implies "this was already documented somewhere,"
      making it the strongest case that skipping the wiki would be a real
      regression.
    type: tool-call
    input: 'What was the process for generating a new NPM token for Verdaccio?'
    tool: wiki_locate
    argChecks:
      - path: context
        match: exists
