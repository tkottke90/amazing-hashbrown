suite:
  id: loop-guard
  name: Loop Guard
  purpose: >
    Verifies the loop guard's nudge/reflection ladder actually changes agent
    behavior once stagnation or a long unbroken tool-call streak is seeded —
    not just that the counters fire (unit tests already cover that), but that
    the model responds to the injected guidance by trying something different
    or stopping, instead of repeating itself indefinitely. See issue #266 and
    docs/superpowers/specs/2026-10-05-loop-guard-stagnation-reflection-design.md.
  passingThreshold: 0.8

scenarios:
  - id: lg-001-stagnation-past-nudge-changes-approach
    name: Agent changes approach after repeated identical shell_exec results
    purpose: >
      Seeds 3 byte-identical shell_exec tool/result pairs chasing the same
      search — the real "Abort" investigation shape from issue #266, where
      an agent re-ran grep for a literal string ~20 times with no new
      findings — followed by the exact nudge HumanMessage
      recursion-guard.middleware.ts injects once stagnationNudgeThreshold is
      reached (copied verbatim from its template there, filled in for
      shell_exec x3). The harness's tool-sequence executor calls the model
      directly on the seeded history (see runner.ts/tool-sequence.ts) — it
      never runs the real middleware — so without this seeded turn the
      scenario would only measure the model's own unprompted tendency to
      stop, not whether it responds to our nudge.
      Scored by responseRubric (see tool/responseRubric below), not a
      blanket "no further shell_exec" check: two real eval runs showed a
      model can legitimately satisfy the nudge's own wording ("try a
      clearly different approach") with a genuinely different tool call
      (e.g. `ls -la` to sanity-check assumptions) — a blanket check would
      wrongly fail that. What actually distinguishes good from bad here is
      whether the next action is materially different from the repeated
      search, not whether a tool gets called at all.
    type: tool-sequence
    turns:
      - user: >
          Find every place the literal string "Abort" appears in this repo.
      - tool: shell_exec
        args: { command: 'grep -r Abort .', reason: 'searching for literal Abort string' }
        result: { text: "no matches\n" }
      - tool: shell_exec
        args: { command: 'grep -r Abort .', reason: 'searching for literal Abort string' }
        result: { text: "no matches\n" }
      - tool: shell_exec
        args: { command: 'grep -r Abort .', reason: 'searching for literal Abort string' }
        result: { text: "no matches\n" }
      - user: >
          You've called `shell_exec` 3 times in a row with materially the
          same result. Before trying again: state what you've actually
          confirmed so far, and either try a clearly different approach or
          conclude the investigation.
    # tool is set to an impossible name so the mechanical tool-check always
    # trivially passes — the responseRubric judge below is the real gate,
    # since this scenario needs to tell "cosmetic re-run of the same
    # command" apart from "genuinely different approach", which a blanket
    # forbidden-tool check can't do (see issue #266 and the Ornith/
    # gpt-oss:20b repro in PR #269).
    tool: '!__never_called__'
    argChecks: []
    responseRubric: >
      Pass if the agent's next action either (a) concludes the
      investigation (states what's been confirmed and stops without
      calling shell_exec again), or (b) tries something that differs
      meaningfully from the repeated `grep -r Abort .` search — a
      materially different command or approach, not the same search with
      cosmetic extra flags (e.g. adding `-n`, `--exclude-dir`, or similar
      tweaks that don't change what's being searched or how). Fail if the
      agent re-runs essentially the same grep search with only cosmetic
      modifications while claiming in its reasoning to have changed
      approach.
    responseMinScore: 7

  - id: lg-002-long-varied-streak-follows-reflection-guidance
    name: Agent follows injected reflection guidance after a long unbroken tool-call streak
    purpose: >
      Seeds 10 varied, non-repeating tool calls — the raw-streak path, where
      nothing ever stagnates (every call looks different) but nothing pauses
      to explain itself either — followed by a seeded guidance HumanMessage
      standing in for what loop-reflection.ts's evaluateLoopProgress() would
      inject on a converging:true verdict (see buildReflectionPrompt's own
      spec for that field: "a short instruction for what to do next"). That
      guidance is genuinely LLM-generated at runtime, so there's no fixed
      template to copy verbatim the way lg-001's nudge allows — this is a
      representative stand-in, written tersely and directively, the way
      loop-reflection.test.ts's own fixtures model it ("check the next
      file", "keep going, try X next"), replacing an earlier version of
      this scenario whose seeded text was meta-commentary/conditional
      phrasing ("only make another tool call if there's a concrete next
      step") that doesn't resemble real guidance and let a model legitimately
      exploit its own escape hatch — two providers correctly identified a
      concrete next step and acted on it per that text, then mechanically
      failed anyway (see PR #269's evaluation of this suite).
      Scored by responseRubric, not a blanket "no further shell_exec" check:
      the real converging:true path hands the agent a concrete next step,
      and following that instruction can legitimately mean calling
      shell_exec again — on the one file the guidance actually names. What
      distinguishes good from bad here is whether the agent's next action
      is scoped to what the guidance said, not whether a tool gets called
      at all.
    type: tool-sequence
    turns:
      - user: >
          Investigate how the task queue handles retries and summarize what
          you find as you go.
      - tool: shell_exec
        args: { command: 'ls api/src/agents', reason: 'orienting in the agents folder' }
        result: { text: "chat-agent.ts\ntask-execution.ts\nrecursion-guard.middleware.ts\n" }
      - tool: shell_exec
        args:
          {
            command: 'grep -n retry api/src/agents/task-execution.ts',
            reason: 'looking for retry logic',
          }
        result: { text: "no matches\n" }
      - tool: shell_exec
        args:
          {
            command: 'grep -rn retry api/src/services',
            reason: 'checking services for retry handling',
          }
        result: { text: "provider-queue.ts:42: // retried on transient failure\n" }
      - tool: shell_exec
        args:
          {
            command: 'cat api/src/services/provider-queue.ts',
            reason: 'reading the retry implementation',
          }
        result: { text: "export async function withSlot(...) { /* ... */ }\n" }
      - tool: shell_exec
        args:
          {
            command: 'grep -n withSlot api/src/agents/task-execution.ts',
            reason: 'finding where withSlot is used',
          }
        result: { text: "task-execution.ts:118: await getProviderQueue().withSlot(...)\n" }
      - tool: shell_exec
        args:
          {
            command: 'sed -n "100,130p" api/src/agents/task-execution.ts',
            reason: 'reading the surrounding context',
          }
        result: { text: "  // ...\n  await getProviderQueue().withSlot(...)\n" }
      - tool: shell_exec
        args:
          {
            command: 'grep -n maxConcurrency api/src/config/env.ts',
            reason: 'checking concurrency config',
          }
        result: { text: "env.ts:31:  maxConcurrency: z.number().int().optional(),\n" }
      - tool: shell_exec
        args:
          {
            command: 'grep -rn maxConcurrency api/src/services/provider-queue.ts',
            reason: 'checking how concurrency is enforced',
          }
        result: { text: "provider-queue.ts:55:  const limit = config.maxConcurrency ?? 1;\n" }
      - tool: shell_exec
        args:
          {
            command: 'grep -n completeQueueEntry api/src/services/workspace-store.ts',
            reason: 'checking how a queue entry is completed',
          }
        result: { text: "workspace-store.ts:210: completeQueueEntry(id, status) { /* ... */ }\n" }
      - tool: shell_exec
        args:
          {
            command: 'cat api/src/services/cron-settlement.ts',
            reason: 'checking retry/backoff on scheduled failures',
          }
        result:
          {
            text: "export function settleCronRun(...) { /* auto-pause after N consecutive scheduled failures */ }\n",
          }
      - user: >
          The only unconfirmed claim left is the retry comment at
          provider-queue.ts:42 — your last read of that file came back as a
          stub. Read the actual lines around it next; treat everything else
          as settled unless that changes it.
    # tool is set to an impossible name so the mechanical tool-check always
    # trivially passes — the responseRubric judge below is the real gate,
    # since the guidance above can legitimately be followed by calling
    # shell_exec again (on provider-queue.ts specifically), unlike a blanket
    # forbidden-tool check which would wrongly fail an agent for doing
    # exactly what it was just told to do.
    tool: '!__never_called__'
    argChecks: []
    responseRubric: >
      Pass if the agent's next action either (a) calls shell_exec targeting
      specifically api/src/services/provider-queue.ts (e.g. reading the
      lines around the line-42 retry comment with sed/cat/grep scoped to
      that file) — following the guidance's specific instruction — or (b)
      gives a final summary that explicitly names that same gap (the elided
      provider-queue.ts body) and stops without calling shell_exec on
      anything else. Fail if the agent calls shell_exec on any file other
      than provider-queue.ts (re-treading already-confirmed ground like
      cron-settlement.ts or workspace-store.ts, or wandering to something
      new the guidance didn't ask for), or gives a vague/generic response
      that ignores the specific gap named in the guidance.
    responseMinScore: 7
