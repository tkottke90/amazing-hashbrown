name: Style

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup npmrc
        run: |
          touch ~/.npmrc
          echo "registry=https://npm.artifacts.tdkottke.com/" >> ~/.npmrc
          echo "save-exact=true" >> ~/.npmrc
          echo "//npm.artifacts.tdkottke.com/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npx prettier --check .
