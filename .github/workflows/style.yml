name: Style

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup npmrc
        run: |
          touch ~/.npmrc
          echo "registry=https://npm.artifacts.tdkottke.com/" >> ~/.npmrc
          echo "save-exact=true" >> ~/.npmrc
          echo "//npm.artifacts.tdkottke.com/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # TEMPORARY DEBUG STEP — remove before merge. The sandbox this PR was
      # authored in has no working npm install (private registry 401), so
      # this prints exactly what the real pinned Prettier wants for the one
      # file still failing --check, without guessing from a different local
      # Prettier version.
      - name: debug-prettier-diff
        run: |
          npx prettier --write api/src/config/env.ts
          git diff --no-color api/src/config/env.ts || true
          git checkout -- api/src/config/env.ts

      - run: npx prettier --check .
