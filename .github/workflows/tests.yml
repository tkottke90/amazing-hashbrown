name: Tests

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup npmrc
        run: echo "//npm.artifacts.tdkottke.com/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Run Tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup npmrc
        run: echo "//npm.artifacts.tdkottke.com/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Build library packages
        run: npm run build:libs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests (CI-safe subset)
        id: run-tests
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        id: upload-report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright report to S3
        id: upload-s3-report
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-playwright-report
        with:
          report-dir: e2e/playwright-report
          bucket-url: ${{ vars.PLAYWRIGHT_REPORT_BUCKET_URL }}
          public-url: ${{ vars.PLAYWRIGHT_REPORT_PUBLIC_URL }}
          aws-access-key-id: ${{ secrets.PLAYWRIGHT_REPORT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PLAYWRIGHT_REPORT_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.PLAYWRIGHT_REPORT_AWS_REGION || 'us-east-1' }}
          repo-name: ${{ github.event.repository.name }}
          commit-sha: ${{ github.sha }}
          ttl-days: ${{ vars.PLAYWRIGHT_REPORT_TTL_DAYS || '5' }}

      - name: Comment on PR with report link
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        env:
          REPORT_URL: ${{ steps.upload-s3-report.outputs.report-url }}
          E2E_STATUS: ${{ steps.run-tests.outcome }}
        with:
          script: |
            const marker = '<!-- playwright-e2e-report -->';
            const status = process.env.E2E_STATUS;
            const icon = status === 'success' ? '✅' : '❌';
            const reportUrl = process.env.REPORT_URL;
            const reportLink = reportUrl
              ? `**Report:** [View HTML report](${reportUrl})`
              : `**Report:** not generated (check run logs)`;
            const body = [
              marker,
              `### ${icon} Playwright E2E Report`,
              '',
              `**Status:** ${status}`,
              `**Run:** [#${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              reportLink,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
