name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # gh release upload

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Detect dry run
        id: detect
        run: bin/release.sh detect-dry-run "${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Setup npmrc
        run: |
          touch ~/.npmrc
          echo "registry=https://${NPM_DOMAIN}/" >> ~/.npmrc
          echo "save-exact=true" >> ~/.npmrc
          echo "//${NPM_DOMAIN}/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_DOMAIN: ${{ vars.NPM_DOMAIN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Build app + Docker image (amd64 only)
        run: bin/release.sh docker-build-release
        env:
          SKIP_ARM64_BUILD: 'true'

      - name: Docker login to Zot
        if: steps.detect.outputs.is_dry_run != 'true'
        run: docker login "${{ vars.ZOT_URL }}" -u "${{ secrets.ZOT_USERNAME }}" -p "${{ secrets.ZOT_TOKEN }}"

      - name: Tag and save release image
        if: steps.detect.outputs.is_dry_run != 'true'
        run: |
          bin/release.sh docker-tag-version amazing-hashbrown:latest \
            "${{ vars.ZOT_URL }}/amazing-hashbrown:${{ github.ref_name }}"
          bin/release.sh docker-save \
            "${{ vars.ZOT_URL }}/amazing-hashbrown:${{ github.ref_name }}" \
            /tmp/amazing-hashbrown.tar

      - name: Upload image tar to GitHub Release
        if: steps.detect.outputs.is_dry_run != 'true'
        run: bin/release.sh release-upload-asset "${{ github.ref_name }}" /tmp/amazing-hashbrown.tar
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Push versioned + latest tags to Zot
        if: steps.detect.outputs.is_dry_run != 'true'
        run: bin/release.sh registry-publish "${{ vars.ZOT_URL }}/amazing-hashbrown" "${{ github.ref_name }}"
